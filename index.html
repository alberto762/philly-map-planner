<style>
:root{
  --bg:#05081a;--surface:#0b1230;--surface-2:#111a3d;--ink:#e9eef7;--muted:#9fa3ad;--line:#22305c;
  --accent:#71b0d2;--accent-ink:#060d2c;--accent-soft:#16304a;--gold:#e9cd79;--boundary:#e04b55;
  --danger:#ff7b72;--danger-soft:#3a1518;--warn:#e9cd79;--warn-soft:#332b12;--ok:#7fd4a0;--ok-soft:#12301f;
  --sheet:#03050f;--label:#8b93a8;--focus:#e9cd79;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.45);
  --font-display:"Hanken Grotesk","Arial Narrow",Arial,sans-serif;
  --font-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
.app{height:100%;display:grid;grid-template-columns:232px minmax(0,1fr) 330px;grid-template-rows:auto minmax(0,1fr)}
.top{grid-column:1 / -1;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:28px;height:28px;border-radius:4px;background:var(--gold);display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:5px}
.logo i{background:var(--accent-ink);border-radius:1px;opacity:.9}
.logo i:nth-child(2){opacity:.45}
.brand h1{font-family:var(--font-display);font-weight:800;font-size:19px;letter-spacing:.14em;color:var(--gold);margin:0;text-transform:uppercase;line-height:1}
.spacer{flex:1}
.saved{font-size:12px;color:var(--muted);white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:12.5px;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);border-radius:0;padding:8px 18px}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.icon{padding:6px 9px;min-width:34px}
.kbd{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;margin-left:2px}
.side{border-right:1px solid var(--line);background:var(--surface);overflow:auto;padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.side .group{font-family:var(--font-display);font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-size:12.5px;margin:14px 8px 6px}
.side .group:first-child{margin-top:0}
.steps{position:relative;display:flex;flex-direction:column;gap:2px}
.step{position:relative;display:grid;grid-template-columns:30px 1fr;align-items:start;gap:10px;text-align:left;border:1px solid transparent;background:transparent;border-radius:8px;padding:8px;cursor:pointer;width:100%}
.steps .step:not(:last-child)::after{content:"";position:absolute;left:22px;top:38px;bottom:-6px;width:2px;background:var(--line)}
.step .num{position:relative;z-index:1;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-mono);font-size:13px;font-weight:600;border:1.5px solid var(--line);background:var(--surface)}
.step .num.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.step .lbl{font-weight:600;line-height:1.2;display:block;padding-top:2px}
.step .meta{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:2px;font-variant-numeric:tabular-nums}
.step:hover{background:var(--surface-2)}
.step[aria-current="true"]{background:var(--accent-soft);border-color:transparent}
.step[aria-current="true"] .num{background:var(--gold);border-color:var(--gold);color:#060d2c}
.badge{font-family:var(--font-mono);font-size:11px;border-radius:999px;padding:0 6px;margin-left:6px;vertical-align:1px}
.badge.err{background:var(--danger-soft);color:var(--danger)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.step-select{display:none}
.stage{display:flex;flex-direction:column;min-width:0;min-height:0}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.toolbar .title{font-family:var(--font-display);font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);font-size:18px}
.toolbar .hint{color:var(--muted);font-size:12.5px}
.zoom{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.zoom button{border:0;background:transparent;padding:4px 10px;cursor:pointer;font-family:var(--font-mono)}
.zoom button+button{border-left:1px solid var(--line)}
.zoom span{padding:4px 8px;font-family:var(--font-mono);font-size:12px;border-left:1px solid var(--line);color:var(--muted);min-width:52px;text-align:center}
.sheet{flex:1;min-height:0;overflow:auto;background:var(--sheet);padding:16px;position:relative}
.sheet svg{display:block;touch-action:none;user-select:none;-webkit-user-select:none;margin:0 auto;background:#000;border-radius:6px;box-shadow:var(--shadow)}
.sheet svg text{font-family:var(--font-mono)}
.sheet .axis{fill:var(--label);font-size:11px}
.caption{display:flex;gap:14px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:12.5px;min-height:38px;padding:9px 16px;border-top:1px solid var(--line);background:var(--surface)}
.caption .where{font-family:var(--font-mono);font-weight:600;color:var(--ink)}
.panel{border-left:1px solid var(--line);background:var(--surface);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h2{font-family:var(--font-display);font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);font-size:21px;margin:0;line-height:1.1}
.panel h3{font-family:var(--font-display);font-weight:600;text-transform:uppercase;letter-spacing:.07em;font-size:13.5px;margin:0;color:var(--muted)}
.panel p{margin:0;color:var(--muted)}
.note{border-radius:8px;padding:9px 11px;font-size:12.5px;background:var(--surface-2);color:var(--muted)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 8px;cursor:pointer;font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.swatches{display:flex;flex-direction:column;gap:2px}
.sw{display:grid;grid-template-columns:20px 70px 1fr auto;align-items:center;gap:8px;border:1px solid transparent;border-radius:7px;background:transparent;padding:5px 7px;text-align:left;cursor:pointer;min-width:0}
.sw:hover{background:var(--surface-2)}
.sw[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.sw .cnt{font-family:var(--font-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip{width:20px;height:20px;border-radius:5px;border:1px solid rgba(0,0,0,.18)}
.chip.erase{background:repeating-linear-gradient(45deg,var(--surface-2) 0 4px,var(--line) 4px 6px)}
.code{font-family:var(--font-mono);font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.field .lab{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.field input[type="number"],.field select,.field textarea,.field input[type="text"]{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:7px 9px;width:100%}
.field textarea{min-height:90px;resize:vertical;font-size:12.5px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px}
.checks label{display:flex;gap:6px;align-items:center;font-size:13px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--font-mono);font-size:12.5px;overflow-wrap:anywhere}
.issues{display:flex;flex-direction:column;gap:4px}
.issue{display:grid;grid-template-columns:auto 44px 1fr;gap:8px;align-items:start;text-align:left;border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:7px 9px;cursor:pointer}
.issue:hover{border-color:var(--muted)}
.sev{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;border-radius:4px;padding:1px 5px}
.sev.error{background:var(--danger-soft);color:var(--danger)}
.sev.warn{background:var(--warn-soft);color:var(--warn)}
.issue .at{font-family:var(--font-mono);font-weight:600}
.sec{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.cfg-row{display:grid;grid-template-columns:84px 1fr auto auto;gap:4px;align-items:center}
.cfg-row.nb{grid-template-columns:60px 1fr 70px auto auto}
.cfg-row.ops{grid-template-columns:110px 1fr auto}
.cfg-row.biz{grid-template-columns:96px 1fr 1fr auto;padding-bottom:6px;border-bottom:1px solid var(--line)}
.cfg-row.biz .wide{grid-column:span 2}
.cfg-row.biz label{font-size:12px;display:flex;gap:4px;align-items:center;white-space:nowrap}
.cfg-row input[type="text"],.cfg-row select{border:1px solid var(--line);background:var(--surface-2);border-radius:5px;padding:4px 6px;width:100%;min-width:0;font-size:12.5px}
.cfg-row input.c{font-family:var(--font-mono);font-weight:600}
.cfg-row input[type="color"]{width:30px;height:26px;padding:0;border:1px solid var(--line);border-radius:5px;background:none}
.cfg-row .x{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:2px 6px;font-size:16px;line-height:1}
.cfg-row .x:hover{color:var(--danger)}
.cfg-vals{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lotflag{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
.gridsize{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center}
.gridsize .side-l{font-size:12.5px;color:var(--muted)}
.gridsize .ctl{display:inline-flex;gap:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat{background:var(--surface-2);border-radius:7px;padding:7px 9px}
.stat b{display:block;font-family:var(--font-mono);font-size:17px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.modal-wrap{position:fixed;inset:0;background:rgba(10,15,20,.45);display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;max-width:540px;width:100%;display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto;box-shadow:var(--shadow)}
.modal h2{font-family:var(--font-display);text-transform:uppercase;margin:0;font-size:21px}
.modal textarea{width:100%;min-height:180px;font-family:var(--font-mono);font-size:11.5px;border:1px solid var(--line);border-radius:7px;background:var(--surface-2);padding:8px}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gold);color:#060d2c;font-weight:600;padding:8px 14px;border-radius:8px;font-size:13px;z-index:30;box-shadow:var(--shadow);max-width:min(560px,90vw)}
.review li{margin:2px 0;font-size:12.5px;color:var(--muted)}
.review{margin:0;padding-left:18px}
@media (max-width:1180px){.app{grid-template-columns:210px minmax(0,1fr) 300px}}
@media (max-width:960px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(420px,1fr) auto;height:auto;min-height:100%}
  .side{border-right:0;border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-left,0px));display:block}
  .side > *:not(.step-select){display:none}
  .step-select{display:block;width:100%;border:1px solid var(--line);border-radius:7px;padding:8px;background:var(--surface-2)}
  .panel{border-left:0;border-top:1px solid var(--line)}
  .sheet{min-height:420px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
(function(){
const WEALTH=["Poor","Medium","Rich"];
const OWNER_KINDS=["Player","Civilian","SpecialCivilian","ArmedCivilian","EnemyGang","Police","Empty"];
const S=40,OFF=28,STORE="philly-map-planner.v5";
const STEPS=[
  {id:"ground",n:"1",label:"Ground",hint:"Mark lots and paint terrain"},

const TOOLS=[{id:"check",label:"Check",hint:"Errors before the Unity import"},{id:"config",label:"Config",hint:"Codes, colors and sizes"},{id:"file",label:"Save and share",hint:"Export, import, Miro version"}];
const LISTS=[

];
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isObj=v=>v!==null&&typeof v==="object"&&!Array.isArray(v);

function colName(x){let s="";x++;while(x>0){const r=(x-1)%26;s=String.fromCharCode(65+r)+s;x=Math.floor((x-1)/26);}return s;}
const cellName=(x,y)=>colName(x)+(y+1);
function lum(hex){const m=/^#?([0-9a-f]{6})$/i.exec(hex||"");if(!m)return 1;const n=parseInt(m[1],16);return(0.299*((n>>16)&255)+0.587*((n>>8)&255)+0.114*(n&255))/255;}
const key=(x,y)=>x+"_"+y;

let seed=null;try{seed=JSON.parse($("#seed").textContent);}catch(_){}
const st={d:null,step:"ground",brush:{},bmode:"buildings",sel:null,hover:null,zoom:0,draft:null,draftDirty:false,draftMsg:"",idx:{},bc:null,undo:[],redo:[],savedAt:null,saveErr:false,issuesShown:[]};

function fromExport(x){
  const d={cfg:x.config?clone(x.config):null,cells:{},edges:{},blocks:{},source:x.source||null,review:Array.isArray(x.review)?x.review:[]};
  for(const c of x.cells||[]){if(!Number.isInteger(c.x)||!Number.isInteger(c.y))continue;const o={};if(c.ground)o.t=c.ground;if(c.building)o.b=c.building;if(c.marker)o.m=c.marker;if(c.neighborhood)o.n=c.neighborhood;if(c.owner)o.o=c.owner;if(Object.keys(o).length)d.cells[key(c.x,c.y)]=o;}
  for(const e of x.edges||[]){if((e.dir==="h"||e.dir==="v")&&Number.isInteger(e.x)&&Number.isInteger(e.y)&&e.street)d.edges[e.dir+"_"+e.x+"_"+e.y]=e.street;}
  for(const b of x.blocks||[]){const p=parseCell(b.id);if(!p)continue;if(b.purchasable==null&&!(b.illegal||[]).length&&!b.robbery&&!b.otherRobbery&&!b.notes&&!b.requiredIllegal&&!(b.requiredPurchase||[]).length&&b.random==null)continue;d.blocks[key(p[0],p[1])]={purchasable:b.purchasable==null?null:b.purchasable,illegal:b.illegal||[],robbery:b.robbery||null,other:b.otherRobbery||null,notes:b.notes||"",reqIll:b.requiredIllegal||null,reqBuy:b.requiredPurchase||[],random:b.random==null?null:b.random};}
  return d;
}
function parseCell(s){const m=/^([A-Z]+)(\d+)$/.exec(s||"");if(!m)return null;let x=0;for(const ch of m[1])x=x*26+(ch.charCodeAt(0)-64);return[x-1,+m[2]-1];}
function load(){
  try{const raw=localStorage.getItem(STORE);if(raw){const d=JSON.parse(raw);if(d&&d.cells){st.d=d;st.savedAt=d.savedAt||null;return;}}}catch(_){}
  st.d=seed?fromExport(seed):{cfg:null,cells:{},edges:{},blocks:{},review:[]};
}
let saveTimer=null;
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{try{st.d.savedAt=new Date().toISOString();localStorage.setItem(STORE,JSON.stringify(st.d));st.savedAt=st.d.savedAt;st.saveErr=false;}catch(_){st.saveErr=true;}renderSaved();},250);}
function renderSaved(){const el=$("#saved");if(st.saveErr){el.textContent="Not saved in this browser. Export to keep your work.";el.style.color="var(--danger)";return;}el.style.color="";el.textContent=st.savedAt?"Saved in this browser, "+new Date(st.savedAt).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}):"Not saved yet";}
function snapshot(){return JSON.stringify({cfg:st.d.cfg,cells:st.d.cells,edges:st.d.edges,blocks:st.d.blocks});}
function pushUndo(){st.undo.push(snapshot());if(st.undo.length>60)st.undo.shift();st.redo=[];}
function restore(s){const o=JSON.parse(s);st.d.cfg=o.cfg;st.d.cells=o.cells;st.d.edges=o.edges;st.d.blocks=o.blocks;rebuildIdx();st.bc=null;st.draft=null;st.draftDirty=false;save();render();}
function undo(){if(!st.undo.length)return;st.redo.push(snapshot());restore(st.undo.pop());toast("Undone");}
function redo(){if(!st.redo.length)return;st.undo.push(snapshot());restore(st.redo.pop());toast("Redone");}

function list(k){return st.d.cfg&&Array.isArray(st.d.cfg[k])?st.d.cfg[k]:[];}
function rebuildIdx(){st.idx={};for(const L of LISTS){const m=new Map();for(const it of list(L.k))if(it&&it.code)m.set(it.code,it);st.idx[L.k]=m;}}
function num(v,d,lo,hi){const n=parseInt(v,10);if(!isFinite(n))return d;return Math.max(lo,Math.min(hi,n));}
const gw=()=>num(st.d.cfg&&st.d.cfg.gridW,21,4,60);
const gh=()=>num(st.d.cfg&&st.d.cfg.gridH,21,4,60);
function defTerrain(){const d=st.d.cfg&&st.d.cfg.defaultTerrain;if(d&&st.idx.terrain.has(d))return d;const t=list("terrain")[0];return t?t.code:null;}
const cellAt=(x,y)=>st.d.cells[key(x,y)]||{};
const terrainAt=(x,y)=>cellAt(x,y).t||defTerrain();
function isLot(x,y){const t=st.idx.terrain&&st.idx.terrain.get(terrainAt(x,y));return !!(t&&t.lot);}
function edgeKey(x1,y1,x2,y2){if(x2===x1+1)return"v_"+x2+"_"+y1;if(x2===x1-1)return"v_"+x1+"_"+y1;if(y2===y1+1)return"h_"+x1+"_"+y2;return"h_"+x1+"_"+y1;}
const edgeAt=k=>st.d.edges[k]||null;

function setCell(k,field,val){const c=Object.assign({},st.d.cells[k]||{});if(val==null)delete c[field];else c[field]=val;if(Object.keys(c).length)st.d.cells[k]=c;else delete st.d.cells[k];st.bc=null;}
function setEdge(k,val){if(val==null)delete st.d.edges[k];else st.d.edges[k]=val;st.bc=null;}

function computeBlocks(){
  if(st.bc)return st.bc;
  const W=gw(),H=gh();const id=new Int32Array(W*H).fill(-1);const blocks=[];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(id[y*W+x]>=0||!isLot(x,y))continue;
    const bi=blocks.length;const cells=[];const q=[[x,y]];id[y*W+x]=bi;
    while(q.length){const [cx,cy]=q.shift();cells.push([cx,cy]);
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy;
        if(nx<0||ny<0||nx>=W||ny>=H||id[ny*W+nx]>=0||!isLot(nx,ny))continue;
        if(edgeAt(edgeKey(cx,cy,nx,ny)))continue;id[ny*W+nx]=bi;q.push([nx,ny]);}}
    blocks.push({i:bi,anchor:key(x,y),ax:x,ay:y,cells});
  }
  st.bc={id,blocks,W,H};return st.bc;
}
function blockData(b){
  const d=st.d.blocks[b.anchor];if(isObj(d))return{key:b.anchor,data:d,legacy:[]};
  const legacy=[];let found=null;
  for(const [x,y] of b.cells){const k=key(x,y);const v=st.d.blocks[k];if(isObj(v)){legacy.push(k);if(!found)found={key:k,data:v};}}
  return found?{key:found.key,data:found.data,legacy}:null;
}
function blockNbs(b){const s=new Set();for(const [x,y] of b.cells){const n=cellAt(x,y).n;if(n)s.add(n);}return[...s];}

function issues(){
  const out=[];if(!st.d.cfg)return out;const W=gw(),H=gh();const I=st.idx;
  const add=(sev,x,y,text)=>out.push({sev,x,y,at:cellName(x,y),text});
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const c=cellAt(x,y);const lot=isLot(x,y);
    if(c.t&&!I.terrain.has(c.t))add("error",x,y,'Unknown ground "'+c.t+'"');
    if(c.b&&!I.buildings.has(c.b))add("error",x,y,'Unknown building "'+c.b+'"');
    if(c.b&&!lot)add("error",x,y,"Building on a cell that is not a lot");
    if(c.m&&!I.markers.has(c.m))add("error",x,y,'Unknown marker "'+c.m+'"');
    if(c.m&&!lot)add("warn",x,y,"Marker outside a lot");
    if(c.n&&!I.neighborhoods.has(c.n))add("error",x,y,'Unknown neighborhood "'+c.n+'"');
    if(lot&&!c.n)add("error",x,y,"Lot without a neighborhood");
    if(lot&&!c.b)add("warn",x,y,"Lot without a building");
    if(c.o&&!I.owners.has(c.o))add("error",x,y,'Unknown owner "'+c.o+'"');
    if(c.o&&!lot)add("warn",x,y,"Owner on a cell that is not a block");
    if(c.m==="PLY"&&lot){const ow=I.owners.get(c.o);if(!ow||ow.kind!=="Player")add("warn",x,y,"Player HQ marker on a block the player does not own");}
  }
  for(const k of Object.keys(st.d.edges)){const v=st.d.edges[k];const p=k.split("_");if(!I.streets.has(v))add("error",+p[1],Math.min(+p[2],H-1),'Unknown street "'+v+'"');}
  for(const b of computeBlocks().blocks){
    const ns=blockNbs(b);if(ns.length>1)add("error",b.ax,b.ay,"Block spans "+ns.length+" neighborhoods ("+ns.join(", ")+")");
    const bd=blockData(b);if(!bd){add("warn",b.ax,b.ay,"Block has no gameplay data");continue;}
    const d=bd.data;
    for(const o of (Array.isArray(d.illegal)?d.illegal:[]))if(!I.operations.has(o))add("error",b.ax,b.ay,'Unknown operation "'+o+'"');
    if(d.robbery&&!I.robbery.has(d.robbery))add("error",b.ax,b.ay,'Unknown robbery level "'+d.robbery+'"');
    if(d.other&&!I.robbery.has(d.other))add("error",b.ax,b.ay,'Unknown robbery level "'+d.other+'"');
    const p=+d.purchasable||0;
    if((d.illegal||[]).length&&p<1)add("warn",b.ax,b.ay,"Illegal sites set but no purchasable sites");
    if(p>b.cells.length)add("warn",b.ax,b.ay,"More purchasable sites ("+p+") than lots ("+b.cells.length+")");
    const biz=[d.reqIll,...(Array.isArray(d.reqBuy)?d.reqBuy:[])].filter(Boolean);
    for(const c of biz)if(!I.businesses.has(c))add("error",b.ax,b.ay,'Unknown business "'+c+'"');
    if(d.reqIll){const it=I.businesses.get(d.reqIll);if(it&&!it.op)add("warn",b.ax,b.ay,'Business "'+d.reqIll+'" for the illegal operation allows none');}
    const room=blockRoom(b),want=biz.length+(+d.random||0);
    if(want>room)add("warn",b.ax,b.ay,"Block businesses need "+want+" buildings, it has about "+room);
  }
  out.sort((a,b)=>(a.sev===b.sev?0:a.sev==="error"?-1:1)||(a.y-b.y)||(a.x-b.x));
  return out;
}
function counts(){
  const W=gw(),H=gh();let lots=0,built=0,named=0,owned=0;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(isLot(x,y)){lots++;const c=cellAt(x,y);if(c.b)built++;if(c.n)named++;if(c.o)owned++;}}
  const B=computeBlocks();let filled=0;for(const b of B.blocks)if(blockData(b))filled++;
  return{lots,built,named,owned,blocks:B.blocks.length,filled,streets:Object.keys(st.d.edges).length};
}

function brushList(){
  switch(st.step){
    case"ground":return{k:"terrain",field:"t",items:list("terrain"),erase:false};
    case"areas":return{k:"neighborhoods",field:"n",items:list("neighborhoods"),erase:true};
    case"streets":return{k:"streets",items:list("streets"),erase:true};
    case"owners":return{k:"owners",field:"o",items:list("owners"),erase:true};
    case"buildings":return st.bmode==="markers"?{k:"markers",field:"m",items:list("markers"),erase:true}:{k:"buildings",field:"b",items:list("buildings"),erase:true};
  }
  return null;
}
function currentBrush(){const bl=brushList();if(!bl)return undefined;const v=st.brush[bl.k];if(v===""&&bl.erase)return"";if(v&&bl.items.some(i=>i.code===v))return v;return bl.items[0]?bl.items[0].code:undefined;}

function svgPoint(e){const svg=$("#map");const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const m=svg.getScreenCTM();if(!m)return null;const q=pt.matrixTransform(m.inverse());return{gx:(q.x-OFF)/S,gy:(q.y-OFF)/S};}
function cellFromPt(p){if(!p)return null;const x=Math.floor(p.gx),y=Math.floor(p.gy);if(x<0||y<0||x>=gw()||y>=gh())return null;return{x,y};}
function edgeFromPt(p){
  if(!p)return null;const W=gw(),H=gh();const {gx,gy}=p;
  if(gx<-0.3||gy<-0.3||gx>W+0.3||gy>H+0.3)return null;
  const dx=Math.abs(gx-Math.round(gx)),dy=Math.abs(gy-Math.round(gy));if(Math.min(dx,dy)>0.25)return null;
  if(dy<=dx){const x=Math.floor(gx),y=Math.round(gy);if(x<0||x>=W||y<0||y>H)return null;return"h_"+x+"_"+y;}
  const x=Math.round(gx),y=Math.floor(gy);if(y<0||y>=H||x<0||x>W)return null;return"v_"+x+"_"+y;
}
function edgeLabel(k){const p=k.split("_");const x=+p[1],y=+p[2];
  if(p[0]==="h")return(y>0?cellName(x,y-1):"edge")+" | "+(y<gh()?cellName(x,y):"edge");
  return(x>0?cellName(x-1,y):"edge")+" | "+(x<gw()?cellName(x,y):"edge");}

function applyCell(x,y){
  const bl=brushList();const b=currentBrush();if(!bl||!bl.field||b===undefined)return false;
  const f=bl.field;const c=cellAt(x,y);if(f==="t"&&!b)return false;
  if(stroke.mode===null)stroke.mode=(f!=="t"&&b&&c[f]===b)?"erase":"paint";
  const val=stroke.mode==="erase"||b===""?null:b;
  if((c[f]||null)===val)return false;
  if((f==="b"||f==="m")&&val&&!isLot(x,y)){toast("Only lots take a "+(f==="b"?"building":"marker")+". Mark the cell as a lot in 1. Ground.");return false;}
  if(!stroke.pushed){pushUndo();stroke.pushed=true;}
  setCell(key(x,y),f,val);return true;
}
function applyEdge(k){
  const b=currentBrush();if(b===undefined)return false;const cur=edgeAt(k);
  if(stroke.mode===null)stroke.mode=(b&&cur===b)?"erase":"paint";
  const val=stroke.mode==="erase"||b===""?null:b;if(cur===val)return false;
  if(!stroke.pushed){pushUndo();stroke.pushed=true;}
  setEdge(k,val);return true;
}

let toastTimer=null;
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.hidden=true;},2600);}

function onDown(e){
  if(e.button!==undefined&&e.button!==0)return;
  const p=svgPoint(e);
  if(!brushList()){
    const c=cellFromPt(p);if(!c)return;
    const B=computeBlocks();const bi=B.id[c.y*B.W+c.x];
    if(bi<0){toast(cellName(c.x,c.y)+" is not a lot. A block is a group of lots between streets.");return;}
    st.sel=B.blocks[bi].anchor;if(st.step!=="gameplay")setStep("gameplay");else render();return;
  }
  if(!st.d.cfg){toast("Set up the lists in Config first.");return;}
  try{$("#map").setPointerCapture(e.pointerId);}catch(_){}
  stroke={edges:st.step==="streets",mode:null,last:null,pushed:false};
  e.preventDefault();onMove(e);
}
function onMove(e){
  const p=svgPoint(e);
  if(st.step==="streets"){const k=edgeFromPt(p);st.hover=k?{edge:k}:null;}else{const c=cellFromPt(p);st.hover=c?{cell:c}:null;}
  if(stroke){
    let changed=false;
    if(stroke.edges){const k=st.hover&&st.hover.edge;if(k&&k!==stroke.last){stroke.last=k;changed=applyEdge(k);}}
    else{const c=st.hover&&st.hover.cell;const k=c&&key(c.x,c.y);if(k&&k!==stroke.last){stroke.last=k;changed=applyCell(c.x,c.y);}}
    if(changed)renderMap();
  }else renderHover();
  renderCaption();
}
function onUp(){if(!stroke)return;const s=stroke;stroke=null;if(s.pushed){save();render();}}

function stepMeta(id,C){
  if(!st.d.cfg)return"";
  if(id==="ground")return C.lots+" lots on a "+gw()+"×"+gh()+" grid";
  if(id==="areas")return C.named+" of "+C.lots+" lots named";
  if(id==="streets")return C.streets+" street lines, "+C.blocks+" blocks";
  if(id==="buildings")return C.built+" of "+C.lots+" lots built";
  if(id==="owners")return C.owned+" of "+C.lots+" blocks owned";
  if(id==="gameplay")return C.filled+" of "+C.blocks+" blocks filled";
  return"";
}
function stepDone(id,C){
  if(!st.d.cfg||!C.lots)return false;
  if(id==="ground")return C.lots>0;
  if(id==="areas")return C.named===C.lots;
  if(id==="streets")return C.streets>0&&C.blocks>0;
  if(id==="buildings")return C.built===C.lots;
  if(id==="owners")return C.owned===C.lots;
  if(id==="gameplay")return C.filled===C.blocks;
  return false;
}
function renderSide(){

  h+='</div><div class="group">Before the import</div>';
  for(const t of TOOLS){
    let extra="";

    if(t.id==="config"&&st.draftDirty)extra='<span class="badge warn">unsaved</span>';
    const icon=t.id==="check"?"✓":t.id==="config"?"⚙":"⇅";
    h+='<button class="step" type="button" data-step="'+t.id+'" aria-current="'+(st.step===t.id)+'"><span class="num">'+icon+'</span><span><span class="lbl">'+esc(t.label)+extra+'</span><span class="meta">'+esc(t.hint)+"</span></span></button>";
  }
  h+='<select class="step-select" id="step-select" aria-label="Step">'+STEPS.map(s=>'<option value="'+s.id+'"'+(st.step===s.id?" selected":"")+">"+s.n+". "+esc(s.label)+"</option>").join("")+TOOLS.map(t=>'<option value="'+t.id+'"'+(st.step===t.id?" selected":"")+">"+esc(t.label)+"</option>").join("")+"</select>";
  $("#side").innerHTML=h;
}

function fitScale(){const sh=$("#sheet");const W=gw(),H=gh();const vw=OFF+W*S+6,vh=OFF+H*S+6;const aw=sh.clientWidth-32,ah=sh.clientHeight-32;return Math.max(.3,Math.min(aw/vw,ah/vh,3));}

function buildExport(){
  const W=gw(),H=gh();const cells=[];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=cellAt(x,y);cells.push({cell:cellName(x,y),x,y,ground:terrainAt(x,y),lot:isLot(x,y),building:c.b||null,marker:c.m||null,neighborhood:c.n||null,owner:c.o||null});}
  const edges=Object.keys(st.d.edges).map(k=>{const p=k.split("_");return{dir:p[0],x:+p[1],y:+p[2],street:st.d.edges[k],between:edgeLabel(k)};});
  const blocks=computeBlocks().blocks.map(b=>{const bd=blockData(b);const d=bd?bd.data:{};const ns=blockNbs(b);const nb=ns.length===1?ns[0]:null;const it=nb&&st.idx.neighborhoods.get(nb);
    return{id:cellName(b.ax,b.ay),cells:b.cells.map(([x,y])=>cellName(x,y)),neighborhood:nb,district:it&&it.district||null,purchasable:d.purchasable==null?null:+d.purchasable,illegal:Array.isArray(d.illegal)?d.illegal:[],robbery:d.robbery||null,otherRobbery:d.other||null,notes:d.notes||"",requiredIllegal:d.reqIll||null,requiredPurchase:Array.isArray(d.reqBuy)?d.reqBuy:[],random:d.random==null?null:+d.random};});
  return{format:"philly-map-planner",version:1,exportedAt:new Date().toISOString(),source:st.d.source||null,grid:{width:W,height:H,cellMeters:+st.d.cfg.cellMeters||25,roadWidth:+st.d.cfg.roadWidth||14,sidewalk:+st.d.cfg.sidewalk||3,origin:"A1 is the top-left cell; x grows right, y grows down"},config:st.d.cfg,cells,edges,blocks,review:st.d.review||[],issues:issues().map(i=>({severity:i.sev,cell:i.at,text:i.text}))};
}
function growGrid(side,n){
  if(!st.d.cfg)return;const W=gw(),H=gh();
  const horiz=side==="left"||side==="right";const nw=horiz?W+n:W,nh=horiz?H:H+n;
  if(nw<4||nh<4||nw>60||nh>60){toast("The grid stays between 4 and 60 cells on each side.");return;}
  const dx=side==="left"?n:0,dy=side==="top"?n:0;
  pushUndo();
  const cells={},edges={},blocks={};let lost=0;
  for(const k of Object.keys(st.d.cells)){const [x,y]=k.split("_").map(Number);const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=nw||ny>=nh){lost++;continue;}cells[key(nx,ny)]=st.d.cells[k];}
  for(const k of Object.keys(st.d.edges)){const p=k.split("_");const nx=+p[1]+dx,ny=+p[2]+dy;const ok=p[0]==="h"?(nx>=0&&nx<nw&&ny>=0&&ny<=nh):(nx>=0&&nx<=nw&&ny>=0&&ny<nh);if(ok)edges[p[0]+"_"+nx+"_"+ny]=st.d.edges[k];}
  for(const k of Object.keys(st.d.blocks)){const [x,y]=k.split("_").map(Number);const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=nw||ny>=nh)continue;blocks[key(nx,ny)]=st.d.blocks[k];}
  st.d.cells=cells;st.d.edges=edges;st.d.blocks=blocks;st.d.cfg=Object.assign({},st.d.cfg,{gridW:nw,gridH:nh});
  if(st.sel){const [x,y]=st.sel.split("_").map(Number);st.sel=key(x+dx,y+dy);}
  st.bc=null;st.draft=null;save();render();
  toast((n>0?"Added":"Removed")+" a "+(horiz?"column":"row")+" "+(side==="top"?"on top":side==="bottom"?"at the bottom":"on the "+side)+". Grid is now "+nw+"×"+nh+(lost?". "+lost+" painted cells removed.":"."));
}
function doExport(){
  if(!st.d.cfg){toast("Nothing to export yet.");return;}
  const data=buildExport();const json=JSON.stringify(data,null,1);const errs=data.issues.filter(i=>i.severity==="error").length;
  const name="philly-map-"+new Date().toISOString().slice(0,10)+".json";
  try{const url=URL.createObjectURL(new Blob([json],{type:"application/json"}));const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);}catch(_){}

  if(t.dataset.zoom!==undefined){const z=+t.dataset.zoom;const cur=st.zoom||fitScale();st.zoom=z===0?0:Math.max(.3,Math.min(4,Math.round((cur*(z>0?1.25:0.8))*100)/100));applyZoom();return;}
  if(t.dataset.add){const L=LISTS.find(l=>l.k===t.dataset.add);st.draft[t.dataset.add].push(L.biz?{code:"",name:"",type:"",wealth:"Medium",op:"",recruit:false}:L.own?{code:"",name:"",kind:"Civilian",color:"#8899aa"}:L.color?{code:"",name:"",color:"#8899aa"}:{code:"",name:""});markDirty();renderPanel();return;}
  if(t.dataset.del){st.draft[t.dataset.del].splice(+t.dataset.i,1);markDirty();renderPanel();return;}
  if(t.dataset.issue!==undefined){const i=st.issuesShown[+t.dataset.issue];if(!i)return;const B=computeBlocks();const bi=B.id[i.y*B.W+i.x];
    if(/block|gameplay|purchasable|operation|robbery/i.test(i.text)&&bi>=0){st.sel=B.blocks[bi].anchor;setStep("gameplay");}
    else{const map={"Lot without a neighborhood":"areas","Lot without a building":"buildings","Marker outside a lot":"buildings","Building on a cell that is not a lot":"buildings"};setStep(map[i.text]||"ground");}
    st.hover={cell:{x:i.x,y:i.y}};renderHover();renderCaption();return;}
  if(t.id==="cfg-save"){saveConfig();return;}
  if(t.id==="cfg-reset"){st.draft=null;st.draftDirty=false;st.draftMsg="";renderPanel();renderSide();return;}
  if(t.id==="export-btn"||t.id==="export-btn2"){doExport();return;}
  if(t.id==="import-btn"){$("#import-file").click();return;}
  if(t.id==="seed-btn"){openModal('<h2>Load the Miro version</h2><p>This replaces the current map with the one read from Miro. Undo brings your map back.</p><div class="row"><button class="btn primary" type="button" id="seed-confirm">Load it</button><button class="btn" type="button" data-modal-close>Cancel</button></div>');document.getElementById("seed-confirm").onclick=()=>replaceWith(seed,"Miro version loaded");return;}
  if(t.id==="undo"){undo();return;}
  if(t.id==="redo"){redo();return;}
  if(t.dataset.modalClose!==undefined){closeModal();return;}
  if(t.id==="modal-copy"){const ta=$("#modal-json");try{navigator.clipboard.writeText(ta.value).then(()=>{t.textContent="Copied";},()=>{ta.select();});}catch(_){ta.select();}return;}
  if(t.id==="import-confirm"){if(importData)replaceWith(importData,"Map imported");return;}
});
document.addEventListener("input",e=>{
  const t=e.target;if(!t.dataset)return;
  if(t.dataset.list){const it=st.draft[t.dataset.list][+t.dataset.i];if(!it)return;it[t.dataset.f]=t.type==="checkbox"?t.checked:t.value;markDirty();return;}
  if(t.dataset.val){st.draft[t.dataset.val]=t.value===""?"":Number(t.value);markDirty();return;}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="step-select"){setStep(t.value);return;}
  if(t.id==="import-file"){readImport(t);return;}
  if(t.dataset&&t.dataset.list&&(t.dataset.f==="code"||t.tagName==="SELECT")){renderPanel();renderSide();return;}
  if(t.id==="f-purch"||t.id==="f-rob"||t.id==="f-other"||t.id==="f-notes"||t.id==="f-reqill"||t.id==="f-random"||(t.dataset&&(t.dataset.op||t.dataset.buy)))saveBlock();
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&$("#modal-root").innerHTML){closeModal();return;}
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||"");
  if((e.ctrlKey||e.metaKey)&&!typing){const k=e.key.toLowerCase();if(k==="z"&&!e.shiftKey){e.preventDefault();undo();return;}if(k==="y"||(k==="z"&&e.shiftKey)){e.preventDefault();redo();return;}}
  if(!typing&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&/^[1-6]$/.test(e.key)){setStep(STEPS[+e.key-1].id);}
});
window.addEventListener("resize",()=>{if(!st.zoom)applyZoom();});
window.addEventListener("storage",e=>{if(e.key===STORE&&e.newValue){try{const d=JSON.parse(e.newValue);if(d&&d.cells){st.d=d;rebuildIdx();st.bc=null;render();}}catch(_){}}});
const svg=$("#map");
svg.addEventListener("pointerdown",onDown);svg.addEventListener("pointermove",onMove);svg.addEventListener("pointerup",onUp);svg.addEventListener("pointercancel",onUp);
svg.addEventListener("pointerleave",()=>{if(!stroke){st.hover=null;renderHover();renderCaption();}});

load();rebuildIdx();
try{const s=localStorage.getItem(STORE+".step");if(s&&STEPS.concat(TOOLS).some(x=>x.id===s))st.step=s;}catch(_){}
render();
})();
</script>
</body>
</html>
