<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Philly Map Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Hanken+Grotesk:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#111110;--surface:#191917;--surface-2:#23221f;--ink:#efe8d6;--muted:#aba493;--line:#35322c;
  --accent:#3d8a72;--accent-ink:#f3ecd8;--accent-soft:#1c3129;--gold:#d6ad55;--boundary:#e8742c;
  --danger:#ef6a5b;--danger-soft:#3a1714;--warn:#e7b24a;--warn-soft:#352a12;--ok:#7cc49a;--ok-soft:#16301f;
  --sheet:#0b0b0a;--label:#9d9686;--focus:#d6ad55;--shadow:0 1px 2px rgba(0,0,0,.5),0 8px 28px rgba(0,0,0,.55);
  --sign:#2f6e5c;--cream:#e2d7b3;
  --font-display:"Oswald","Arial Narrow",Arial,sans-serif;
  --font-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
.app{height:100%;display:grid;grid-template-columns:232px minmax(0,1fr) 330px;grid-template-rows:auto minmax(0,1fr)}
.top{grid-column:1 / -1;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:28px;height:28px;border-radius:4px;background:var(--gold);display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:5px}
.logo i{background:var(--accent-ink);border-radius:1px;opacity:.9}
.logo i:nth-child(2){opacity:.45}
.brand h1{font-family:var(--font-display);font-weight:800;font-size:19px;letter-spacing:.14em;color:var(--gold);margin:0;text-transform:uppercase;line-height:1}
.spacer{flex:1}
.saved{font-size:12px;color:var(--muted);white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:12.5px;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);border-radius:0;padding:8px 18px}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.icon{padding:6px 9px;min-width:34px}
.kbd{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;margin-left:2px}
.side{border-right:1px solid var(--line);background:var(--surface);overflow:auto;padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.side .group{font-family:var(--font-display);font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-size:12.5px;margin:14px 8px 6px}
.side .group:first-child{margin-top:0}
.steps{position:relative;display:flex;flex-direction:column;gap:2px}
.step{position:relative;display:grid;grid-template-columns:30px 1fr;align-items:start;gap:10px;text-align:left;border:1px solid transparent;background:transparent;border-radius:8px;padding:8px;cursor:pointer;width:100%}
.steps .step:not(:last-child)::after{content:"";position:absolute;left:22px;top:38px;bottom:-6px;width:2px;background:var(--line)}
.step .num{position:relative;z-index:1;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-mono);font-size:13px;font-weight:600;border:1.5px solid var(--line);background:var(--surface)}
.step .num.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.step .lbl{font-weight:600;line-height:1.2;display:block;padding-top:2px}
.step .meta{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:2px;font-variant-numeric:tabular-nums}
.step:hover{background:var(--surface-2)}
.step[aria-current="true"]{background:var(--accent-soft);border-color:transparent}
.step[aria-current="true"] .num{background:var(--gold);border-color:var(--gold);color:#060d2c}
.badge{font-family:var(--font-mono);font-size:11px;border-radius:999px;padding:0 6px;margin-left:6px;vertical-align:1px}
.badge.err{background:var(--danger-soft);color:var(--danger)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.step-select{display:none}
.stage{display:flex;flex-direction:column;min-width:0;min-height:0}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.toolbar .title{font-family:var(--font-display);font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);font-size:18px}
.toolbar .hint{color:var(--muted);font-size:12.5px}
.zoom{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.zoom button{border:0;background:transparent;padding:4px 10px;cursor:pointer;font-family:var(--font-mono)}
.zoom button+button{border-left:1px solid var(--line)}
.zoom span{padding:4px 8px;font-family:var(--font-mono);font-size:12px;border-left:1px solid var(--line);color:var(--muted);min-width:52px;text-align:center}
.sheet{flex:1;min-height:0;overflow:auto;background:var(--sheet);padding:16px;position:relative}
.sheet svg{display:block;touch-action:none;user-select:none;-webkit-user-select:none;margin:0 auto;background:#000;border-radius:6px;box-shadow:var(--shadow)}
.sheet svg text{font-family:var(--font-mono)}
.sheet .axis{fill:var(--label);font-size:11px}
.caption{display:flex;gap:14px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:12.5px;min-height:38px;padding:9px 16px;border-top:1px solid var(--line);background:var(--surface)}
.caption .where{font-family:var(--font-mono);font-weight:600;color:var(--ink)}
.panel{border-left:1px solid var(--line);background:var(--surface);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h2{font-family:var(--font-display);font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);font-size:21px;margin:0;line-height:1.1}
.panel h3{font-family:var(--font-display);font-weight:600;text-transform:uppercase;letter-spacing:.07em;font-size:13.5px;margin:0;color:var(--muted)}
.panel p{margin:0;color:var(--muted)}
.note{border-radius:8px;padding:9px 11px;font-size:12.5px;background:var(--surface-2);color:var(--muted)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 8px;cursor:pointer;font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.swatches{display:flex;flex-direction:column;gap:2px}
.sw{display:grid;grid-template-columns:20px 70px 1fr auto;align-items:center;gap:8px;border:1px solid transparent;border-radius:7px;background:transparent;padding:5px 7px;text-align:left;cursor:pointer;min-width:0}
.sw:hover{background:var(--surface-2)}
.sw[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.sw .cnt{font-family:var(--font-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip{width:20px;height:20px;border-radius:5px;border:1px solid rgba(0,0,0,.18)}
.chip.erase{background:repeating-linear-gradient(45deg,var(--surface-2) 0 4px,var(--line) 4px 6px)}
.code{font-family:var(--font-mono);font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.field .lab{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.field input[type="number"],.field select,.field textarea,.field input[type="text"]{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:7px 9px;width:100%}
.field textarea{min-height:90px;resize:vertical;font-size:12.5px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px}
.checks label{display:flex;gap:6px;align-items:center;font-size:13px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--font-mono);font-size:12.5px;overflow-wrap:anywhere}
.issues{display:flex;flex-direction:column;gap:4px}
.issue{display:grid;grid-template-columns:auto 44px 1fr;gap:8px;align-items:start;text-align:left;border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:7px 9px;cursor:pointer}
.issue:hover{border-color:var(--muted)}
.sev{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;border-radius:4px;padding:1px 5px}
.sev.error{background:var(--danger-soft);color:var(--danger)}
.sev.warn{background:var(--warn-soft);color:var(--warn)}
.issue .at{font-family:var(--font-mono);font-weight:600}
.sec{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tb-tools{display:inline-flex;gap:4px}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.trow .ro{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .ro b{display:block;font-family:var(--font-mono);font-size:12px}
.trow .ro{white-space:normal;line-height:1.3}
.cfg-row{display:grid;grid-template-columns:84px 1fr auto auto;gap:4px;align-items:center}
.cfg-row.nb{grid-template-columns:60px 1fr 70px auto auto}
.cfg-row.ops{grid-template-columns:110px 1fr auto}
.cfg-row.biz{grid-template-columns:96px 1fr 1fr auto;padding-bottom:6px;border-bottom:1px solid var(--line)}
.cfg-row.biz .wide{grid-column:span 2}
.cfg-row.biz label{font-size:12px;display:flex;gap:4px;align-items:center;white-space:nowrap}
.cfg-row input[type="text"],.cfg-row select{border:1px solid var(--line);background:var(--surface-2);border-radius:5px;padding:4px 6px;width:100%;min-width:0;font-size:12.5px}
.cfg-row input.c{font-family:var(--font-mono);font-weight:600}
.cfg-row input[type="color"]{width:30px;height:26px;padding:0;border:1px solid var(--line);border-radius:5px;background:none}
.cfg-row .x{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:2px 6px;font-size:16px;line-height:1}
.cfg-row .x:hover{color:var(--danger)}
.cfg-vals{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lotflag{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
.gridsize{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center}
.gridsize .side-l{font-size:12.5px;color:var(--muted)}
.gridsize .ctl{display:inline-flex;gap:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat{background:var(--surface-2);border-radius:7px;padding:7px 9px}
.stat b{display:block;font-family:var(--font-mono);font-size:17px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.modal-wrap{position:fixed;inset:0;background:rgba(10,15,20,.45);display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;max-width:540px;width:100%;display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto;box-shadow:var(--shadow)}
.modal h2{font-family:var(--font-display);text-transform:uppercase;margin:0;font-size:21px}
.modal textarea{width:100%;min-height:180px;font-family:var(--font-mono);font-size:11.5px;border:1px solid var(--line);border-radius:7px;background:var(--surface-2);padding:8px}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gold);color:#060d2c;font-weight:600;padding:8px 14px;border-radius:8px;font-size:13px;z-index:30;box-shadow:var(--shadow);max-width:min(560px,90vw)}
.review li{margin:2px 0;font-size:12.5px;color:var(--muted)}
.review{margin:0;padding-left:18px}
.cloud{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.cloud::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.cloud.ok::before{background:var(--ok)}
.cloud.busy::before{background:var(--gold)}
.cloud.bad{border-color:var(--danger);color:var(--danger)}
.cloud.bad::before{background:var(--danger)}
.cloud.out{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.cloud.out::before{display:none}
.vers{display:flex;flex-direction:column;gap:4px}
.ver{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:12.5px}
.ver .v{font-family:var(--font-mono);font-weight:600}
.cfg{position:fixed;inset:0;z-index:15;background:var(--bg);display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.cfg-top{display:flex;align-items:center;gap:14px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.cfg-top h2{font-family:var(--font-display);font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--gold);font-size:20px;margin:0;line-height:1}
.cfg-top .sub{color:var(--muted);font-size:13px}
.cfg-body{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:0}
.cfg-tabs{border-right:1px solid var(--line);background:var(--surface);padding:14px 10px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.cfg-tabs .group{font-family:var(--font-display);font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-size:12px;margin:14px 10px 6px}
.cfg-tabs .group:first-child{margin-top:0}
.cfg-tab{display:flex;align-items:center;gap:8px;border:0;background:transparent;border-radius:7px;padding:9px 10px;text-align:left;cursor:pointer;font-weight:500;width:100%}
.cfg-tab:hover{background:var(--surface-2)}
.cfg-tab[aria-selected="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--gold)}
.cfg-tab .n{margin-left:auto;font-family:var(--font-mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.cfg-tab .dot{width:8px;height:8px;border-radius:50%;background:var(--danger);flex:none}
.cfg-main{overflow:auto;padding:22px 28px 48px}
.cfg-main .inner{max-width:1180px;display:flex;flex-direction:column;gap:22px}
.cfg-head h3{font-family:var(--font-display);font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);font-size:19px;margin:0}
.cfg-head p{color:var(--muted);margin:6px 0 0;max-width:78ch}
.cfg-sub{display:flex;align-items:baseline;gap:10px}
.cfg-sub h4{font-family:var(--font-display);font-weight:700;text-transform:uppercase;letter-spacing:.07em;font-size:14px;margin:0;color:var(--ink)}
.cfg-sub p{color:var(--muted);margin:0;font-size:12.5px}
.tbl{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.trow{display:grid;grid-template-columns:var(--cols);gap:10px;align-items:center;padding:7px 12px;border-top:1px solid var(--line)}
.trow.head{border-top:0;background:var(--surface-2);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--label);padding:9px 12px}
.trow.bad{background:linear-gradient(90deg,var(--danger-soft),transparent 60%)}
.trow input[type="text"],.trow input[type="number"],.trow select{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:6px 8px;width:100%;min-width:0;font-size:13px}
.trow input.c{font-family:var(--font-mono);font-weight:600}
.trow input.bad{border-color:var(--danger)}
.trow input[type="color"]{width:36px;height:30px;padding:0;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer}
.trow .chk{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
.trow .chk input{width:16px;height:16px}
.trow .err{grid-column:1 / -1;color:var(--danger);font-size:12px;margin-top:-2px}
.trow .used{font-family:var(--font-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.trow .used.on{color:var(--ink)}
.trow .act{display:flex;gap:2px;justify-content:flex-end}
.ibtn{border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:6px;padding:5px 7px;font-size:15px;line-height:1}
.ibtn:hover{background:var(--surface-2);color:var(--ink)}
.ibtn.del:hover{color:var(--danger)}
.tfoot{display:flex;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line);background:var(--surface)}
.tfoot .muted{font-size:12.5px}
.empty{padding:18px 12px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}
.filter{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:7px 10px;min-width:240px}
.vals{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.vals .field small{color:var(--muted);font-size:12px}
.cfg-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px max(16px,env(safe-area-inset-right,0px)) max(11px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--surface)}
.cfg-foot .state{font-size:13px;color:var(--muted)}
.cfg-foot .state.dirty{color:var(--warn)}
.cfg-foot .state.bad{color:var(--danger)}
.cfg-foot .state.ok{color:var(--ok)}
@media (max-width:760px){
  .cfg-top .sub{display:none}
  .cfg-body{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .cfg-tabs{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px 10px}
  .cfg-tabs .group{display:none}
  .cfg-tab{white-space:nowrap;width:auto}
  .cfg-tab[aria-selected="true"]{box-shadow:inset 0 -3px 0 var(--gold)}
  .cfg-main{padding:16px 16px 36px}
  .trow.head{display:none}
  .trow{grid-template-columns:1fr 1fr;padding:12px}
  .trow > [data-label]::before{content:attr(data-label);display:block;font-size:10.5px;font-weight:600;color:var(--label);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
  .trow .act{align-self:end}
  .filter{min-width:0;width:100%}
}
@media (max-width:1180px){.app{grid-template-columns:210px minmax(0,1fr) 300px}}
@media (max-width:960px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(420px,1fr) auto;height:auto;min-height:100%}
  .side{border-right:0;border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-left,0px));display:block}
  .side > *:not(.step-select){display:none}
  .step-select{display:block;width:100%;border:1px solid var(--line);border-radius:7px;padding:8px;background:var(--surface-2)}
  .panel{border-left:0;border-top:1px solid var(--line)}
  .sheet{min-height:420px}
}
body{font-size:14px;line-height:1.45}

function restore(s){const o=JSON.parse(s);st.d.cfg=o.cfg;st.d.cells=o.cells;st.d.edges=o.edges;st.d.blocks=o.blocks;rebuildIdx();st.bc=null;st.draft=null;st.draftDirty=false;save();render();}
function undo(){if(!st.undo.length)return;st.redo.push(snapshot());restore(st.undo.pop());toast("Undone");}
function redo(){if(!st.redo.length)return;st.undo.push(snapshot());restore(st.redo.pop());toast("Redone");}

function list(k){return st.d&&st.d.cfg&&Array.isArray(st.d.cfg[k])?st.d.cfg[k]:[];}
function rebuildIdx(){st.idx={};for(const L of LISTS){const m=new Map();for(const it of list(L.k))if(it&&it.code)m.set(it.code,it);st.idx[L.k]=m;}}
function num(v,d,lo,hi){const n=parseInt(v,10);if(!isFinite(n))return d;return Math.max(lo,Math.min(hi,n));}
const gw=()=>num(st.d.cfg&&st.d.cfg.gridW,21,4,60);
const gh=()=>num(st.d.cfg&&st.d.cfg.gridH,21,4,60);
function defTerrain(){const d=st.d.cfg&&st.d.cfg.defaultTerrain;if(d&&st.idx.terrain.has(d))return d;const t=list("terrain")[0];return t?t.code:null;}
const cellAt=(x,y)=>st.d.cells[key(x,y)]||{};
const terrainAt=(x,y)=>cellAt(x,y).t||defTerrain();
function isLot(x,y){const t=st.idx.terrain&&st.idx.terrain.get(terrainAt(x,y));return !!(t&&t.lot);}
function edgeKey(x1,y1,x2,y2){if(x2===x1+1)return"v_"+x2+"_"+y1;if(x2===x1-1)return"v_"+x1+"_"+y1;if(y2===y1+1)return"h_"+x1+"_"+y2;return"h_"+x1+"_"+y1;}
const edgeAt=k=>st.d.edges[k]||null;

function setCell(k,field,val){const c=Object.assign({},st.d.cells[k]||{});if(val==null)delete c[field];else c[field]=val;if(Object.keys(c).length)st.d.cells[k]=c;else delete st.d.cells[k];st.bc=null;}
function setEdge(k,val){if(val==null)delete st.d.edges[k];else st.d.edges[k]=val;st.bc=null;}

function computeBlocks(){
  if(st.bc)return st.bc;
  const W=gw(),H=gh();const id=new Int32Array(W*H).fill(-1);const blocks=[];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(id[y*W+x]>=0||!isLot(x,y))continue;
    const bi=blocks.length;const cells=[];const q=[[x,y]];id[y*W+x]=bi;
    while(q.length){const [cx,cy]=q.shift();cells.push([cx,cy]);
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy;
        if(nx<0||ny<0||nx>=W||ny>=H||id[ny*W+nx]>=0||!isLot(nx,ny))continue;
        if(edgeAt(edgeKey(cx,cy,nx,ny)))continue;id[ny*W+nx]=bi;q.push([nx,ny]);}}
    blocks.push({i:bi,anchor:key(x,y),ax:x,ay:y,cells});
  }
  st.bc={id,blocks,W,H};return st.bc;
}
function blockData(b){
  const d=st.d.blocks[b.anchor];if(isObj(d))return{key:b.anchor,data:d,legacy:[]};
  const legacy=[];let found=null;
  for(const [x,y] of b.cells){const k=key(x,y);const v=st.d.blocks[k];if(isObj(v)){legacy.push(k);if(!found)found={key:k,data:v};}}
  return found?{key:found.key,data:found.data,legacy}:null;
}
function normBlock(x){x=isObj(x)?x:{};const n=v=>v==null||v===""?null:Math.max(0,parseInt(v,10)||0);
  const reqBuy=Array.isArray(x.reqBuy)?x.reqBuy:[];
  let slots=Array.isArray(x.slots)?x.slots.map(s=>({biz:(s&&s.biz)||"",it:(s&&s.it)||""})):null;
  if(!slots){
    slots=[];
    if(Array.isArray(x.pairs))x.pairs.forEach(p=>slots.push({biz:(p&&p.biz)||"",it:(p&&p.it)||"*"}));
    else{const c=n(x.ill)||0;for(let i=0;i<c;i++)slots.push({biz:i===0&&x.reqIll?x.reqIll:"",it:"*"});}
    const buys0=Array.isArray(x.buys)?x.buys.map(b=>b||""):reqBuy.slice();
    if(!Array.isArray(x.buys)){const c=n(x.legal!=null?x.legal:x.purchasable)||0;while(buys0.length<c)buys0.push("");}
    buys0.forEach(b=>slots.push({biz:b,it:""}));
  }
  let lotOther=null;
  if(x.bt){const bt=btList().find(q=>q.code===x.bt);if(bt){slots=(bt.slots||[]).map(s=>slotOf(s.legal));lotOther=Math.max(0,(+bt.total||0)-slots.length);}}
  const pairs=slots.filter(s=>s.it),buys=slots.filter(s=>!s.it).map(s=>s.biz);
  const hasCounts=!!x.bt||!!x.lot||Array.isArray(x.slots)||Array.isArray(x.pairs)||Array.isArray(x.buys)||x.ill!=null||x.legal!=null||x.purchasable!=null;
  return{bt:x.bt||null,lot:x.lot||null,legal:hasCounts?buys.length:null,ill:hasCounts?pairs.length:null,nonPlay:lotOther!=null?lotOther:n(x.nonPlay),slots,pairs,buys,tpl:x.tpl||null,illegal:Array.isArray(x.illegal)?x.illegal:[],robbery:x.robbery||null,other:x.other||null,notes:x.notes||"",reqIll:null,reqBuy:buys.filter(Boolean),vals:isObj(x.vals)?x.vals:{}};}
function lotList(){return(st.d&&st.d.cfg&&Array.isArray(st.d.cfg.lots))?st.d.cfg.lots:[];}
function itList(){return(st.d&&st.d.cfg&&Array.isArray(st.d.cfg.illegalTemplates))?st.d.cfg.illegalTemplates:[];}
function itName(it,ops){if(it&&it.name)return it.name;return(it&&it.ops&&it.ops.length)?it.ops.map(c=>((ops||list("operations")).find(o=>o.code===c)||{}).name||c).join(" + "):"Empty template";}
function seedIllegalTemplates(){
  if(!st.d.cfg||Array.isArray(st.d.cfg.illegalTemplates))return;st.d.cfg.illegalTemplates=[];return;
  const seen={},out=[];
  for(const n of list("neighborhoods"))for(const s of(Array.isArray(n.sites)?n.sites:[])){const ops=(s.ops||[]).filter(o=>o!=="HQ").slice().sort();const k=ops.join("+");if(!ops.length||seen[k])continue;seen[k]=1;out.push({code:"IT"+String(out.length+1).padStart(2,"0"),ops});}
  st.d.cfg.illegalTemplates=out;
}
const blockTotal=n=>(n.legal||0)+(n.ill||0)+(n.nonPlay||0);
const MAX_LI=2,MAX_LO=3;
const illBad=n=>(n.ill||0)>MAX_LI||(n.legal||0)>MAX_LO;
const countsNote=n=>(n.ill||0)>MAX_LI?"Legal + illegal goes from 0 to "+MAX_LI+".":(n.legal||0)>MAX_LO?"Legal only goes from 0 to "+MAX_LO+".":blockTotal(n)+" buildings in total.";
function blockNbs(b){const s=new Set();for(const [x,y] of b.cells){const n=cellAt(x,y).n;if(n)s.add(n);}return[...s];}

function issues(){
  const out=[];if(!st.d.cfg)return out;const W=gw(),H=gh();const I=st.idx;
  const add=(sev,x,y,text)=>out.push({sev,x,y,at:cellName(x,y),text});
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const c=cellAt(x,y);const lot=isLot(x,y);
    if(c.t&&!I.terrain.has(c.t))add("error",x,y,'Unknown ground "'+c.t+'"');
    if(c.b&&!I.buildings.has(c.b))add("error",x,y,'Unknown building "'+c.b+'"');
    if(c.b&&!lot)add("error",x,y,"Building on a cell that is not a lot");
    if(c.n&&!I.neighborhoods.has(c.n))add("error",x,y,'Unknown neighborhood "'+c.n+'"');
    if(lot&&!c.n)add("error",x,y,"Lot without a neighborhood");
    if(lot&&!c.b)add("warn",x,y,"Lot without a building");
    if(c.o&&!I.owners.has(c.o))add("error",x,y,'Unknown owner "'+c.o+'"');
    if(c.o&&!lot)add("warn",x,y,"Owner on a cell that is not a block");
  }
  for(const k of Object.keys(st.d.edges)){const v=st.d.edges[k];const p=k.split("_");if(!I.streets.has(v))add("error",+p[1],Math.min(+p[2],H-1),'Unknown street "'+v+'"');}
  for(const b of computeBlocks().blocks){
    const ns=blockNbs(b);if(ns.length>1)add("error",b.ax,b.ay,"Block spans "+ns.length+" neighborhoods ("+ns.join(", ")+")");
    const bd=blockData(b);if(!bd){add("warn",b.ax,b.ay,"Block has no gameplay data");continue;}
    const d=normBlock(bd.data);
    if(d.robbery&&!I.robbery.has(d.robbery))add("error",b.ax,b.ay,'Unknown robbery level "'+d.robbery+'"');
    if(d.other&&!I.robbery.has(d.other))add("error",b.ax,b.ay,'Unknown robbery level "'+d.other+'"');
    if(!d.bt)add("warn",b.ax,b.ay,"Block has no block type (4. Blocks)");
    else if(!btList().some(q=>q.code===d.bt))add("error",b.ax,b.ay,'Unknown block type "'+d.bt+'"');
    if((d.ill||0)>MAX_LI)add("warn",b.ax,b.ay,"Block has "+d.ill+" legal + illegal buildings, the rule is 0 to "+MAX_LI);
    if((d.legal||0)>MAX_LO)add("warn",b.ax,b.ay,"Block has "+d.legal+" legal only buildings, the rule is 0 to "+MAX_LO);
    for(const s of d.slots){
      if(s.biz&&s.biz!=="*"&&!(I.legal&&I.legal.has(s.biz)))add("error",b.ax,b.ay,'Unknown legal "'+s.biz+'"');
      if(s.it&&s.it!=="*"&&!I.operations.has(s.it))add("error",b.ax,b.ay,'Unknown illegal "'+s.it+'"');
    }
  }
  out.sort((a,b)=>(a.sev===b.sev?0:a.sev==="error"?-1:1)||(a.y-b.y)||(a.x-b.x));
  return out;
}
function counts(){
  const W=gw(),H=gh();let lots=0,built=0,named=0,owned=0;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(isLot(x,y)){lots++;const c=cellAt(x,y);if(c.b)built++;if(c.n)named++;if(c.o)owned++;}}
  const B=computeBlocks();let filled=0,typed=0;for(const b of B.blocks){const bd=blockData(b);if(bd)filled++;if(bd&&bd.data.bt)typed++;}
  return{lots,built,named,owned,typed,blocks:B.blocks.length,filled,streets:Object.keys(st.d.edges).length};
}

function brushList(){
  switch(st.step){
    case"ground":return{k:"terrain",field:"t",items:list("terrain"),erase:false};
    case"areas":return{k:"neighborhoods",field:"n",items:list("neighborhoods"),erase:true};
    case"streets":return{k:"streets",items:list("streets"),erase:true};
    case"owners":return{k:"owners",field:"o",items:list("owners"),erase:true};
    case"buildings":return{k:"buildings",field:"b",items:list("buildings"),erase:true};
  }
  return null;
}
function currentBrush(){const bl=brushList();if(!bl)return undefined;const v=st.brush[bl.k];if(v===""&&bl.erase)return"";if(v&&bl.items.some(i=>i.code===v))return v;return bl.items[0]?bl.items[0].code:undefined;}

function svgPoint(e){const svg=$("#map");const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const m=svg.getScreenCTM();if(!m)return null;const q=pt.matrixTransform(m.inverse());return{gx:(q.x-OFF)/S,gy:(q.y-OFF)/S};}
function cellFromPt(p){if(!p)return null;const x=Math.floor(p.gx),y=Math.floor(p.gy);if(x<0||y<0||x>=gw()||y>=gh())return null;return{x,y};}
function edgeFromPt(p){
  if(!p)return null;const W=gw(),H=gh();const {gx,gy}=p;
  if(gx<-0.3||gy<-0.3||gx>W+0.3||gy>H+0.3)return null;
  const dx=Math.abs(gx-Math.round(gx)),dy=Math.abs(gy-Math.round(gy));if(Math.min(dx,dy)>0.25)return null;
  if(dy<=dx){const x=Math.floor(gx),y=Math.round(gy);if(x<0||x>=W||y<0||y>H)return null;return"h_"+x+"_"+y;}
  const x=Math.round(gx),y=Math.floor(gy);if(y<0||y>=H||x<0||x>W)return null;return"v_"+x+"_"+y;
}
function edgeLabel(k){const p=k.split("_");const x=+p[1],y=+p[2];
  if(p[0]==="h")return(y>0?cellName(x,y-1):"edge")+" | "+(y<gh()?cellName(x,y):"edge");
  return(x>0?cellName(x-1,y):"edge")+" | "+(x<gw()?cellName(x,y):"edge");}

function applyCell(x,y){
  const bl=brushList();const b=currentBrush();if(!bl||!bl.field||b===undefined)return false;
  const f=bl.field;const c=cellAt(x,y);if(f==="t"&&!b)return false;
  if(stroke.mode===null)stroke.mode=(f!=="t"&&b&&c[f]===b)?"erase":"paint";
  const val=stroke.mode==="erase"||b===""?null:b;
  if((c[f]||null)===val)return false;
  if((f==="b"||f==="m")&&val&&!isLot(x,y)){toast("Only lots take a "+(f==="b"?"building":"marker")+". Mark the cell as a lot in 1. Ground.");return false;}
  if(!stroke.pushed){pushUndo();stroke.pushed=true;}
  setCell(key(x,y),f,val);return true;
}
function applyEdge(k){
  const b=currentBrush();if(b===undefined)return false;const cur=edgeAt(k);
  if(stroke.mode===null)stroke.mode=(b&&cur===b)?"erase":"paint";
  const val=stroke.mode==="erase"||b===""?null:b;if(cur===val)return false;
  if(!stroke.pushed){pushUndo();stroke.pushed=true;}
  setEdge(k,val);return true;
}

let toastTimer=null;
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.hidden=true;},3800);}

function areaRect(){const a=st.area;if(!a)return null;return{x0:Math.min(a.ax,a.bx),y0:Math.min(a.ay,a.by),x1:Math.max(a.ax,a.bx),y1:Math.max(a.ay,a.by)};}
function fillArea(){
  const r=areaRect();if(!r){toast("Select an area first: press Select area and drag over the map.");return;}
  const bl=brushList();const b=currentBrush();
  if(!bl||!bl.field||b===undefined){toast("Fill works in Ground, Neighborhoods, Buildings and Owners. Pick one of those steps first.");return;}
  const f=bl.field;if(f==="t"&&!b)return;const val=b===""?null:b;
  pushUndo();let n=0,skip=0;
  for(let y=r.y0;y<=r.y1;y++)for(let x=r.x0;x<=r.x1;x++){
    if((f==="b"||f==="m")&&val&&!isLot(x,y)){skip++;continue;}
    if((cellAt(x,y)[f]||null)===val)continue;setCell(key(x,y),f,val);n++;}
  if(!n){st.undo.pop();toast("Nothing to change: the area already has that."+(skip?" Cells that are not lots were skipped.":""));return;}
  save();render();toast((val?"Filled "+n+" cells with "+nameOf(bl.k,val):"Cleared "+n+" cells")+(skip?". "+skip+" cells are not lots and were skipped.":".")+" Undo takes it back.");
}
function copyArea(){
  const r=areaRect();if(!r){toast("Select an area first: press Select and drag over the map.");return;}
  const c={w:r.x1-r.x0+1,h:r.y1-r.y0+1,cells:{},edges:{},blocks:{}};
  for(let y=r.y0;y<=r.y1;y++)for(let x=r.x0;x<=r.x1;x++){const k=key(x,y),k2=key(x-r.x0,y-r.y0);if(st.d.cells[k])c.cells[k2]=clone(st.d.cells[k]);if(isObj(st.d.blocks[k]))c.blocks[k2]=clone(st.d.blocks[k]);}
  for(const k of Object.keys(st.d.edges)){const p=k.split("_"),x=+p[1],y=+p[2];
    const inside=p[0]==="h"?(x>=r.x0&&x<=r.x1&&y>=r.y0&&y<=r.y1+1):(x>=r.x0&&x<=r.x1+1&&y>=r.y0&&y<=r.y1);
    if(inside)c.edges[p[0]+"_"+(x-r.x0)+"_"+(y-r.y0)]=st.d.edges[k];}
  st.clip=c;renderToolbar();toast("Copied "+c.w+"×"+c.h+" cells. Point at a cell and press Ctrl+V, or press Paste.");
}
function pasteAt(x,y){
  const c=st.clip;if(!c)return;const W=gw(),H=gh();
  pushUndo();
  for(let dy=0;dy<c.h;dy++)for(let dx=0;dx<c.w;dx++){const tx=x+dx,ty=y+dy;if(tx>=W||ty>=H)continue;const k=key(tx,ty),k2=key(dx,dy);
    if(c.cells[k2])st.d.cells[k]=clone(c.cells[k2]);else delete st.d.cells[k];
    delete st.d.blocks[k];if(c.blocks[k2])st.d.blocks[k]=clone(c.blocks[k2]);
    if(dy>0)delete st.d.edges["h_"+tx+"_"+ty];if(dx>0)delete st.d.edges["v_"+tx+"_"+ty];}
  for(const k of Object.keys(c.edges)){const p=k.split("_");const nx=+p[1]+x,ny=+p[2]+y;if(p[0]==="h"?(nx<W&&ny<=H):(nx<=W&&ny<H))st.d.edges[p[0]+"_"+nx+"_"+ny]=c.edges[k];}
  st.bc=null;st.pasting=false;st.area={ax:x,ay:y,bx:Math.min(W-1,x+c.w-1),by:Math.min(H-1,y+c.h-1)};save();render();toast("Pasted at "+cellName(x,y)+". Undo takes it back.");
}
function stampTemplate(x,y){
  const t=st.idx.templates&&st.idx.templates.get(st.tpl);if(!t){toast("Pick a template first.");return;}
  const w=num(t.w,1,1,20),h=num(t.h,1,1,20);
  if(x+w>gw()||y+h>gh()){toast("It does not fit there. This template needs "+w+"×"+h+" cells.");return;}
  const lot=list("terrain").find(i=>i.lot);if(!lot){toast('Tick "Buildable" on a ground type in Config first.');return;}
  const street=(list("streets")[0]||{}).code;
  pushUndo();
  let nb=null;for(let cy=y;cy<y+h&&!nb;cy++)for(let cx=x;cx<x+w;cx++){const n=cellAt(cx,cy).n;if(n){nb=n;break;}}
  for(let cy=y;cy<y+h;cy++)for(let cx=x;cx<x+w;cx++){const k=key(cx,cy);setCell(k,"t",lot.code);if(t.building)setCell(k,"b",t.building);if(nb&&!cellAt(cx,cy).n)setCell(k,"n",nb);delete st.d.blocks[k];
    if(cx>x)setEdge("v_"+cx+"_"+cy,null);if(cy>y)setEdge("h_"+cx+"_"+cy,null);}
  if(street){for(let cx=x;cx<x+w;cx++){for(const yy of [y,y+h])if(!edgeAt("h_"+cx+"_"+yy))setEdge("h_"+cx+"_"+yy,street);}
    for(let cy=y;cy<y+h;cy++){for(const xx of [x,x+w])if(!edgeAt("v_"+xx+"_"+cy))setEdge("v_"+xx+"_"+cy,street);}}
  st.d.blocks[key(x,y)]=normBlock({legal:+t.legal||0,ill:+t.ill||0,nonPlay:+t.other||0,tpl:t.code});
  st.sel=key(x,y);st.bc=null;save();render();toast((t.name||t.code)+" placed at "+cellName(x,y));
}
function onDown(e){
  if(e.button!==undefined&&e.button!==0)return;
  const p=svgPoint(e);
  if(st.pasting){const c=cellFromPt(p);if(c)pasteAt(c.x,c.y);return;}
  if(st.selMode||e.shiftKey){const c=cellFromPt(p);if(!c)return;try{$("#map").setPointerCapture(e.pointerId);}catch(_){}st.area={ax:c.x,ay:c.y,bx:c.x,by:c.y};stroke={area:true};e.preventDefault();renderHover();renderToolbar();return;}
  if(st.step==="gameplay"&&st.gmode==="stamp"){const c=cellFromPt(p);if(c)stampTemplate(c.x,c.y);return;}
  if(!brushList()){
    const c=cellFromPt(p);if(!c)return;
    const B=computeBlocks();const bi=B.id[c.y*B.W+c.x];
    if(bi<0){toast(cellName(c.x,c.y)+" is not a lot. A block is a group of lots between streets.");return;}
    st.sel=B.blocks[bi].anchor;if(st.step!=="gameplay")setStep("gameplay");else render();return;
  }
  if(!st.d.cfg){toast("Set up the lists in Config first.");return;}
  try{$("#map").setPointerCapture(e.pointerId);}catch(_){}
  stroke={edges:st.step==="streets",mode:null,last:null,pushed:false};
  e.preventDefault();onMove(e);
}
function onMove(e){
  const p=svgPoint(e);
  if(st.step==="streets"&&!st.selMode&&!st.pasting&&!(stroke&&stroke.area)){const k=edgeFromPt(p);st.hover=k?{edge:k}:null;}else{const c=cellFromPt(p);st.hover=c?{cell:c}:null;}
  if(stroke&&stroke.area){const c=st.hover&&st.hover.cell;if(c){st.area.bx=c.x;st.area.by=c.y;}renderHover();renderCaption();return;}
  if(stroke){
    let changed=false;
    if(stroke.edges){const k=st.hover&&st.hover.edge;if(k&&k!==stroke.last){stroke.last=k;changed=applyEdge(k);}}
    else{const c=st.hover&&st.hover.cell;const k=c&&key(c.x,c.y);if(k&&k!==stroke.last){stroke.last=k;changed=applyCell(c.x,c.y);}}
    if(changed)renderMap();
  }else renderHover();
  renderCaption();
}
function onUp(){if(!stroke)return;const s=stroke;stroke=null;if(s.area){renderToolbar();const r=areaRect();if(r)toast("Area selected: "+(r.x1-r.x0+1)+"×"+(r.y1-r.y0+1)+" cells. Fill it with the brush, or Copy it.");return;}if(s.pushed){save();render();}}

function stepMeta(id,C){
  if(!st.d.cfg)return"";
  if(id==="ground")return C.lots+" lots";
  if(id==="areas")return C.named+"/"+C.lots+" named";
  if(id==="streets")return C.blocks+" blocks";
  if(id==="buildings")return C.built+"/"+C.lots+" built";
  if(id==="owners")return C.owned+"/"+C.lots+" owned";
  if(id==="gameplay")return C.typed+"/"+C.blocks+" with a type";
  return"";
}
function stepDone(id,C){
  if(!st.d.cfg||!C.lots)return false;
  if(id==="ground")return C.lots>0;

const ILLEGAL_COLS=[["code","Code"],["name","Name"],["type","Type"],["install","Install cost"],["costMonth","Running cost"],["inventory","Inventory capacity"],["workers","Worker slots"],["upgrades","Upgrade slots"],["heatInstall","Heat when installed"],["heatCycle","Heat per day"],["heatCar","Heat per car on route"],["fog","Fog reveal radius"]];
function seedGameOps(){
  const c=st.d&&st.d.cfg;if(!c||c.gameOpsSeeded)return;c.gameOpsSeeded=true;
  if(!Array.isArray(c.legal))c.legal=[];
  for(const g of LEGAL_GAME){let it=c.legal.find(x=>x.code===g.code);if(!it){it={code:g.code,name:g.name,ill:{}};c.legal.push(it);}for(const k of Object.keys(g))if(it[k]==null)it[k]=g[k];if(!isObj(it.ill))it.ill={};}
  if(!Array.isArray(c.operations))c.operations=[];
  for(const g of ILLEGAL_GAME){let it=c.operations.find(x=>x.code===g.code);if(!it){it={code:g.code,name:g.name};c.operations.push(it);}for(const k of Object.keys(g))if(it[k]==null)it[k]=g[k];}
  if(!Array.isArray(c.blockTypes))c.blockTypes=[];
}
function btList(){return(st.d&&st.d.cfg&&Array.isArray(st.d.cfg.blockTypes))?st.d.cfg.blockTypes:[];}
function legalIll(code){const l=list("legal").find(x=>x.code===code);return l&&isObj(l.ill)&&Object.keys(l.ill).length?"*":"";}
function slotOf(v){v=v||"*L";if(v==="*I")return{biz:"*",it:"*"};if(v==="*L"||v==="*")return{biz:"*",it:""};return{biz:v,it:legalIll(v)};}
function btSummary(t){const slots=(t.slots||[]).map(s=>slotOf(s.legal));const legal=slots.length,ill=slots.filter(s=>s.it).length,other=Math.max(0,(+t.total||0)-legal);return{legal,ill,only:legal-ill,other,total:+t.total||0};}
function btRule(t){const s=btSummary(t);if(s.ill>MAX_LI)return"More than "+MAX_LI+" with illegal.";if(s.only>MAX_LO)return"More than "+MAX_LO+" legal only.";if(s.legal>s.total)return"More legal buildings than buildings in total.";return"";}
function illText(it,ops){return Object.keys(isObj(it.ill)?it.ill:{}).map(k=>((ops.find(o=>o.code===k)||{}).name||k)).join(", ");}

  h+='<div class="sec"><div class="field"><label for="bt-name">Name</label><input type="text" id="bt-name" data-btf="name" value="'+esc(t.name||"")+'" placeholder="Poor block, 10 buildings"></div>';

  h+=step("total",s.total,"Buildings in total","Every building on the block");
  h+=step("legal",s.legal,"Legal","Playable businesses, up to "+(MAX_LI+MAX_LO));

  h+='<p class="'+(rule?"note warn":"muted")+'" style="font-size:12.5px">'+esc(rule||(s.ill+" with illegal · "+s.only+" legal only · "+s.other+" other"))+"</p>";
  h+='<div class="row"><button class="btn sm" type="button" data-btact="dup">⧉ Duplicate</button><button class="btn sm danger" type="button" data-btact="del">Remove</button></div></div>';
  h+='<p class="note">Click blocks on the map to give them <b>'+esc(t.name||t.code)+"</b>.</p>";
  return h;
}
function editBT(fn){const t=btList().find(x=>x.code===st.btSel);if(!t)return;pushUndo();fn(t);t.ill=Math.max(0,Math.min(+t.ill||0,(t.slots||[]).length));save();renderMap();renderSide();renderPanel();}
function btAction(el){
  const act=el.dataset.btact;
  if(act==="new"){if(!st.d.cfg)return;pushUndo();const L=btList();let n=L.length+1,code;do{code="BT"+String(n++).padStart(2,"0");}while(L.some(x=>x.code===code));st.d.cfg.blockTypes.push({code,name:"",look:"",total:8,ill:1,slots:[{legal:"*",ill:"*"},{legal:"*",ill:""}]});st.btSel=code;save();renderSide();renderPanel();const n2=$("#bt-name");if(n2)n2.focus();return;}
  if(act==="dup"){const t=btList().find(x=>x.code===st.btSel);if(!t)return;pushUndo();const L=btList();let n=L.length+1,code;do{code="BT"+String(n++).padStart(2,"0");}while(L.some(x=>x.code===code));const c=clone(t);c.code=code;c.name=(t.name||t.code)+" copy";L.push(c);st.btSel=code;save();renderPanel();return;}
  if(act==="del"){const t=btList().find(x=>x.code===st.btSel);if(!t)return;const used=Object.values(st.d.blocks).filter(v=>isObj(v)&&v.bt===t.code).length;if(used&&!confirm("This block type is on "+used+" blocks. Remove it anyway? Those blocks lose it."))return;pushUndo();st.d.cfg.blockTypes=btList().filter(x=>x!==t);st.btSel=null;save();render();return;}
  const f=el.dataset.btf;
  editBT(t=>{const step=act==="inc"?1:act==="dec"?-1:0;
    if(f==="total")t.total=Math.max(0,(act?(+t.total||0)+step:parseInt(el.value,10)||0));
    else if(f==="legal"){const n=Math.max(0,Math.min(MAX_LI+MAX_LO,act?(t.slots||[]).length+step:parseInt(el.value,10)||0));t.slots=t.slots||[];while(t.slots.length<n)t.slots.push({legal:"*",ill:"*"});t.slots.length=n;if((+t.total||0)<n)t.total=n;}
    else if(f==="ill")t.ill=Math.max(0,Math.min(MAX_LI,act?(+t.ill||0)+step:parseInt(el.value,10)||0));
    else if(f==="name")t.name=el.value;
    else if(f==="look")t.look=el.value;});
}
function blockTypesTab(d){
  const T=d.blockTypes||[];const legal=d.legal||[];const ops=d.operations||[];
  const opName=c=>((ops.find(o=>o.code===c)||{}).name)||c;
  const legalLabel=l=>{const ks=isObj(l.ill)?Object.keys(l.ill):[];return(l.name||l.code)+(ks.length?" + "+ks.map(opName).join(" / "):"");};
  const used={};for(const v of Object.values(st.d.blocks)){if(isObj(v)&&v.bt)used[v.bt]=(used[v.bt]||0)+1;}
  const cards=T.map((t,i)=>{
    const s=btSummary(t),rule=btRule(t);
    const step=(f,v,lab,help)=>'<div class="count-row"><label><b>'+lab+"</b><small>"+help+'</small></label><div class="stepper sm"><button type="button" data-bx="dec" data-bxf="'+f+'" data-bi="'+i+'" aria-label="One less">−</button><input type="number" min="0" data-bxf="'+f+'" data-bi="'+i+'" value="'+esc(v)+'" aria-label="'+esc(lab)+'"><button type="button" data-bx="inc" data-bxf="'+f+'" data-bi="'+i+'" aria-label="One more">+</button></div></div>';
    let h='<div class="card"><div class="card-head"><div class="lothead"><span class="mono">'+esc(t.code)+'</span><input type="text" data-bxf="name" data-bi="'+i+'" value="'+esc(t.name||"")+'" placeholder="Name this block" aria-label="Name"></div><span class="muted">On '+(used[t.code]||0)+' blocks</span><button class="ibtn" type="button" data-bx="dup" data-bi="'+i+'" title="Duplicate" aria-label="Duplicate">⧉</button><button class="ibtn del" type="button" data-bx="del" data-bi="'+i+'" title="Remove" aria-label="Remove">✕</button></div>';
    h+=step("total",s.total,"Buildings in total","Every building on the block");
    h+=step("legal",s.legal,"Legal","Playable, up to "+(MAX_LI+MAX_LO)+". The illegal comes from each legal.");
    h+=(t.slots||[]).map((sl,j)=>{const v=sl.legal||"*L";const sv=slotOf(v);return'<div class="slot one"><select data-bxs="'+j+'" data-bxk="legal" data-bi="'+i+'"'+(sv.it?' class="ill"':"")+' aria-label="Legal '+(j+1)+'"><option value="*I"'+(v==="*I"?" selected":"")+'>Random, with illegal</option><option value="*L"'+(v==="*L"||v==="*"?" selected":"")+">Random, legal only</option>"+legal.map(l=>'<option value="'+esc(l.code)+'"'+(v===l.code?" selected":"")+">"+esc(legalLabel(l))+"</option>").join("")+"</select></div>";}).join("");
    h+='<p class="'+(rule?"warnc":"muted")+'" style="font-size:12.5px;margin:2px 0 0">'+esc(rule||(s.ill+" with illegal · "+s.only+" legal only · "+s.other+" other"))+"</p></div>";
    return h;});
  return(T.length?'<div class="cards">'+cards.join("")+"</div>":'<p class="note">No block types yet.</p>')+'<div class="row"><button class="btn primary" type="button" data-bx="new">+ New block type</button><span class="muted" style="font-size:12.5px">The illegals of each legal are set in Values › Legal; with more than one, the block gets one of them at random.</span></div>';
}
function bxAction(el){
  const T=st.draft.blockTypes;const act=el.dataset.bx;
  const nextCode=()=>{let n=T.length+1,c;do{c="BT"+String(n++).padStart(2,"0");}while(T.some(x=>x.code===c));return c;};
  if(act==="new"){T.push({code:nextCode(),name:"",total:8,slots:[{legal:"*I"},{legal:"*L"}]});markDirty();rerenderConfig();return;}
  const i=+el.dataset.bi;const t=T[i];if(!t)return;
  if(act==="del"){const used=Object.values(st.d.blocks).filter(v=>isObj(v)&&v.bt===t.code).length;if(used&&!confirm("This block type is on "+used+" blocks. Remove it anyway?"))return;T.splice(i,1);markDirty();rerenderConfig();return;}
  if(act==="dup"){const c=clone(t);c.code=nextCode();c.name=(t.name||t.code)+" copy";T.splice(i+1,0,c);markDirty();rerenderConfig();return;}
  if(el.dataset.bxs!==undefined){const j=+el.dataset.bxs;if(t.slots&&t.slots[j])t.slots[j][el.dataset.bxk]=el.value;markDirty();rerenderConfig();return;}
  const f=el.dataset.bxf;const stp=act==="inc"?1:act==="dec"?-1:0;
  if(f==="name")t.name=el.value;
  else if(f==="total")t.total=Math.max(0,act?(+t.total||0)+stp:parseInt(el.value,10)||0);
  else if(f==="legal"){const n=Math.max(0,Math.min(MAX_LI+MAX_LO,act?(t.slots||[]).length+stp:parseInt(el.value,10)||0));t.slots=t.slots||[];while(t.slots.length<n)t.slots.push({legal:"*L"});t.slots.length=n;if((+t.total||0)<n)t.total=n;}
  markDirty();rerenderConfig();
}
function paintBlockType(c){
  const B=computeBlocks();const bi=B.id[c.y*B.W+c.x];
  if(bi<0){toast(cellName(c.x,c.y)+" is not a lot. A block is a group of lots between streets.");return;}
  const t=btList().find(x=>x.code===st.btSel);if(!t){toast("Pick or make a block type first.");return;}
  const b=B.blocks[bi];const bd=blockData(b);
  pushUndo();const d=Object.assign({},bd?bd.data:{},{bt:t.code});
  if(bd){for(const k of bd.legacy)delete st.d.blocks[k];delete st.d.blocks[bd.key];}
  st.d.blocks[b.anchor]=d;
  if(t.look)for(const [x,y] of b.cells)setCell(key(x,y),"b",t.look);
  st.sel=b.anchor;st.bc=null;save();renderMap();renderSide();renderPanel();toast("Block "+cellName(b.ax,b.ay)+" is now "+(t.name||t.code)+".");
}

function growGrid(side,n){

    else{const map={"Lot without a neighborhood":"areas","Lot without a building":"buildings","Marker outside a lot":"buildings","Building on a cell that is not a lot":"buildings"};setStep(map[i.text]||"ground");}
    st.hover={cell:{x:i.x,y:i.y}};renderHover();renderCaption();return;}
  if(t.id==="cfg-save"){saveConfig();return;}
  if(t.id==="cfg-reset"){st.draft=null;st.draftDirty=false;st.draftMsg="";renderConfig();renderSide();return;}
  if(t.id==="export-btn"||t.id==="export-btn2"){doExport();return;}
  if(t.id==="import-btn"){$("#import-file").click();return;}
  if(t.id==="seed-btn"){openModal('<h2>Load the Miro map</h2><p>This puts back the map exactly as it is on the Miro board: ground, neighborhoods, streets, lots, owners and blocks. Config and Values (legal, illegal, demand, block types) stay. Undo and Versions bring the current map back.</p><div class="row"><button class="btn primary" type="button" id="seed-confirm">Load the Miro map</button><button class="btn" type="button" data-modal-close>Cancel</button></div>');document.getElementById("seed-confirm").onclick=()=>{pushUndo();const d=fromExport(seed);st.d.cells=d.cells;st.d.edges=d.edges;st.d.blocks=d.blocks;st.d.source=d.source;st.d.review=d.review;if(d.cfg){st.d.cfg=Object.assign({},st.d.cfg,{gridW:d.cfg.gridW,gridH:d.cfg.gridH});}rebuildIdx();st.bc=null;st.sel=null;save();closeModal();render();toast("Miro map loaded. Config and Values kept.");};return;}
  if(t.id==="undo"){undo();return;}
  if(t.id==="redo"){redo();return;}
  if(t.dataset.modalClose!==undefined){closeModal();return;}
  if(t.id==="modal-copy"){const ta=$("#modal-json");try{navigator.clipboard.writeText(ta.value).then(()=>{t.textContent="Copied";},()=>{ta.select();});}catch(_){ta.select();}return;}
  if(t.id==="import-confirm"){if(importData)replaceWith(importData,"Map imported");return;}
});
document.addEventListener("submit",async e=>{
  const fm=e.target;if(!fm.id)return;e.preventDefault();const f=cloud.fb;if(!f)return;
  const btn=fm.querySelector('[type="submit"]');if(btn)btn.disabled=true;
  try{
    if(fm.id==="login-form"){await f.signInWithEmailAndPassword(f.auth,$("#lg-email").value.trim(),$("#lg-pass").value);closeModal();toast("Signed in");}
    if(fm.id==="member-form"){const em=$("#mb-email").value;await addMember(em,$("#mb-pass").value,$("#mb-role").value);toast(em.trim().toLowerCase()+" added");loadTeam();}
    if(fm.id==="pw-form"){await f.updatePassword(f.auth.currentUser,$("#pw-new").value);toast("Password changed");$("#pw-new").value="";}
  }catch(err){if(fm.id==="login-form"){const er=$("#lg-err");if(er){er.textContent=authMsg(err);er.hidden=false;}}else toast(authMsg(err));}
  if(btn)btn.disabled=false;
});
document.addEventListener("input",e=>{
  const t=e.target;if(!t.dataset)return;
  if(t.dataset.list){const it=st.draft[t.dataset.list][+t.dataset.i];if(!it)return;const f=t.dataset.f;if(t.type==="checkbox")it[f]=t.checked;else if(t.type==="number"){if(t.value==="")delete it[f];else it[f]=Number(t.value);}else if(t.tagName==="SELECT"&&t.value===""&&(f==="nbType"||f==="wealth"))delete it[f];else it[f]=t.value;markDirty();return;}
  if(t.dataset.def){const d=st.draft.defaults;if(t.value==="")delete d[t.dataset.def];else d[t.dataset.def]=Number(t.value);markDirty();return;}
  if(t.dataset.val){st.draft[t.dataset.val]=t.value===""?"":Number(t.value);markDirty();return;}
  if(t.id==="cfg-filter"){st.cfgFilter=t.value;const pos=t.selectionStart;renderConfig();const f=$("#cfg-filter");if(f){f.focus();try{f.setSelectionRange(pos,pos);}catch(_){}}return;}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="step-select"){setStep(t.value);return;}
  if(t.id==="import-file"){readImport(t);return;}
  if(t.dataset&&(t.dataset.bxf||t.dataset.bxs!==undefined)&&!t.dataset.bx){bxAction(t);return;}
  if(t.dataset&&t.dataset.btf&&!t.dataset.btact){btAction(t);return;}
  if(t.dataset&&t.dataset.btslot!==undefined){const i=+t.dataset.btslot,k=t.dataset.btk,v=t.value;editBT(bt=>{if(bt.slots&&bt.slots[i])bt.slots[i][k]=v;});return;}
  if(t.dataset&&t.dataset.illop!==undefined){const l=st.draft.legal[+t.dataset.illop];if(l){const old=isObj(l.ill)?l.ill[Object.keys(l.ill)[0]]:null;l.ill=t.value?{[t.value]:old||"good"}:{};}markDirty();rerenderConfig();return;}
  if(t.dataset&&t.dataset.illfit!==undefined){const l=st.draft.legal[+t.dataset.illfit];if(l&&isObj(l.ill)){const k=Object.keys(l.ill)[0];if(k)l.ill={[k]:t.value};}markDirty();rerenderConfig();return;}
  if(t.dataset&&t.dataset.mxadd!==undefined){const l=st.draft.legal[+t.dataset.mxadd];if(l&&t.value){if(!isObj(l.ill))l.ill={};l.ill[t.value]="average";}markDirty();rerenderConfig();return;}
  if(t.id==="xls-file"){readSheet(t.files&&t.files[0]);return;}
  if(t.dataset&&t.dataset.lx){lotAction(t);return;}
  if(t.dataset&&t.dataset.itf){const it=st.draft.illegalTemplates[+t.dataset.iti2];if(it){const f=t.dataset.itf;if(f==="name")it.name=t.value;else if(t.value==="")delete it[f];else it[f]=Number(t.value);}markDirty();rerenderConfig();return;}
  if(t.dataset&&t.dataset.slot&&t.value==="__new"){renderPanel();openConfig("bizvalues");const add=document.querySelector('[data-add="businesses"]');if(add)add.click();toast("Name the new business, then Save values. It shows up in every block.");return;}
  if(t.dataset&&t.dataset.slot){const i=+t.dataset.i,f=t.dataset.f,v=t.value;editBlock(d=>{if(d.slots[i])d.slots[i][f]=v;});return;}
  if(t.dataset&&t.dataset.itaddop!==undefined){const it=st.draft.illegalTemplates[+t.dataset.itaddop];if(it&&t.value&&it.ops.indexOf(t.value)<0)it.ops.push(t.value);markDirty();rerenderConfig();return;}
  if(t.dataset&&t.dataset.sx){sitesAction(t);return;}
  if(t.dataset&&(t.dataset.list||t.dataset.def)){rerenderConfig();renderSide();return;}
  if((t.id&&/^f-/.test(t.id))||(t.dataset&&(t.dataset.op||t.dataset.buy)))saveBlock();
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&$("#modal-root").innerHTML){if(!cloud.first&&!cloud.conflict)closeModal();return;}
  if(e.key==="Escape"&&!st.cfgOpen&&(st.pasting||st.area||st.selMode)){st.pasting=false;st.area=null;st.selMode=false;renderToolbar();renderHover();return;}
  if(st.cfgOpen){if(e.key==="Escape"){closeConfig(false);return;}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){e.preventDefault();saveConfig();}return;}
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||"");
  if((e.ctrlKey||e.metaKey)&&!typing){const k=e.key.toLowerCase();
    if(k==="c"&&st.area){e.preventDefault();copyArea();return;}
    if(k==="v"&&st.clip){e.preventDefault();const c=st.hover&&st.hover.cell;if(c)pasteAt(c.x,c.y);else{st.pasting=true;renderToolbar();toast("Click the top-left cell where it goes.");}return;}if(k==="z"&&!e.shiftKey){e.preventDefault();undo();return;}if(k==="y"||(k==="z"&&e.shiftKey)){e.preventDefault();redo();return;}}
  if(!typing&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&/^[1-6]$/.test(e.key)){setStep(STEPS[+e.key-1].id);}
});
document.addEventListener("toggle",e=>{if(e.target&&e.target.id==="more-info")st.moreOpen=e.target.open;},true);
window.addEventListener("resize",()=>{if(!st.zoom)applyZoom();});
window.addEventListener("storage",e=>{if(e.key===STORE&&e.newValue){try{const d=JSON.parse(e.newValue);if(d&&d.cells){st.d=d;rebuildIdx();st.bc=null;render();}}catch(_){}}});
const svg=$("#map");
svg.addEventListener("pointerdown",onDown);svg.addEventListener("pointermove",onMove);svg.addEventListener("pointerup",onUp);svg.addEventListener("pointercancel",onUp);
svg.addEventListener("pointerleave",()=>{if(!stroke){st.hover=null;renderHover();renderCaption();}});

load();seedLegal();seedGameOps();rebuildIdx();seedIllegalTemplates();
try{const s=localStorage.getItem(STORE+".step");if(s&&s!=="config"&&s!=="values"&&STEPS.concat(TOOLS).some(x=>x.id===s))st.step=s;}catch(_){}
render();
cloudInit();
})();
</script>
</body>
</html>
